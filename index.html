*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a1d2a 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

.lead{color:var(--muted);margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;user-select:none;transition:opacity .15s,border-color .15s}
.chip input{appearance:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--cat);margin:0;display:grid;place-content:center;cursor:pointer}
.chip input:checked{background:var(--cat)}
.chip input:checked::after{content:"";width:4px;height:8px;border:solid #08090b;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chip:has(input:checked){border-color:var(--cat)}
.chip:not(:has(input:checked)){opacity:.55}
.chip .n{color:var(--muted);font-size:12px}
.row2{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
.eranav{display:flex;gap:4px;flex-wrap:wrap}
.eranav a{color:var(--muted);text-decoration:none;padding:2px 8px;border-radius:4px}
.eranav a:hover{color:var(--accent);background:var(--surface)}
.count{color:var(--muted)}

main{padding:24px 0 80px}
.era{margin-top:40px;scroll-margin-top:140px}
.era h2{font-family:"Noto Serif JP",serif;font-size:22px;margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.era h2 small{font-family:"Noto Sans JP",sans-serif;font-size:13px;color:var(--muted);font-weight:400}
.era .desc{color:var(--muted);font-size:14px;margin:4px 0 16px}
.era.empty{display:none}
ol{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
li.ev{position:relative;margin:0 0 12px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li.ev::before{content:"";position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--cat);border:3px solid var(--bg)}
li.ev[hidden]{display:none}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.date{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{color:var(--cat);border:1px solid color-mix(in srgb,var(--cat) 40%,transparent);background:color-mix(in srgb,var(--cat) 10%,transparent);padding:0 8px;border-radius:999px;font-size:12px}
.ev h3{font-size:16px;margin:4px 0 2px;font-weight:700}
.ev p{margin:0;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:12px;padding:24px 0 48px;border-top:1px solid var(--line)}
footer p{margin:0 0 6px}
footer .back{margin:8px 0 0}
@media (max-width:600px){
  .eranav{display:none}
  ol{padding-left:16px}
  li.ev::before{left:-24px}

</style>

// ---- 状態の保存（使えない環境でも動くように） ----
const KEY = "history-timeline-cats";
function loadState(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(v)) return new Set(v); }catch(e){}
  return new Set(CATS.map(c=>c.id));
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify([...active])); }catch(e){} }
let active = loadState();

const catById = Object.fromEntries(CATS.map(c=>[c.id,c]));
const eraOf = y => { let e = ERAS[0]; for(const er of ERAS){ if(y >= er.from) e = er; } return e; };

// ---- フィルタのチップ ----
const chipsEl = document.getElementById("chips");
for(const c of CATS){
  const n = EVENTS.filter(e=>e[1]===c.id).length;
  const label = document.createElement("label");
  label.className = "chip";
  label.style.setProperty("--cat", `var(--c-${c.id})`);
  label.innerHTML = `<input type="checkbox" value="${c.id}"><span>${c.name}</span><span class="n">${n}</span>`;
  const cb = label.querySelector("input");
  cb.checked = active.has(c.id);
  cb.addEventListener("change", ()=>{ cb.checked ? active.add(c.id) : active.delete(c.id); apply(); });
  chipsEl.appendChild(label);
}

// ---- 年表の描画 ----
const tl = document.getElementById("timeline");
const nav = document.getElementById("eranav");
const sorted = EVENTS.map((e,i)=>({y:e[0],cat:e[1],date:e[2],title:e[3],desc:e[4],i}))
  .sort((a,b)=> a.y-b.y || a.i-b.i);
const eraLists = {};
for(const er of ERAS){
  const sec = document.createElement("section");
  sec.className = "era"; sec.id = er.id;
  sec.innerHTML = `<h2>${er.name}<small>${er.range}</small></h2><p class="desc">${er.desc}</p><ol></ol>`;
  tl.appendChild(sec);
  eraLists[er.id] = sec;
  const a = document.createElement("a"); a.href = "#"+er.id; a.textContent = er.name; nav.appendChild(a);
}
for(const ev of sorted){
  const li = document.createElement("li");
  li.className = "ev"; li.dataset.cat = ev.cat;
  li.style.setProperty("--cat", `var(--c-${ev.cat})`);
  li.innerHTML = `<div class="meta"><span class="date">${ev.date}</span><span class="tag">${catById[ev.cat].name}</span></div>
    <h3>${ev.title}</h3>${ev.desc?`<p>${ev.desc}</p>`:""}`;
  eraLists[eraOf(ev.y).id].querySelector("ol").appendChild(li);
}

function apply(){
  let shown = 0;
  document.querySelectorAll("li.ev").forEach(li=>{
    const on = active.has(li.dataset.cat); li.hidden = !on; if(on) shown++;
  });
  for(const er of ERAS){
    const sec = eraLists[er.id];
    const any = sec.querySelector("li.ev:not([hidden])");
    sec.classList.toggle("empty", !any);
    nav.querySelector(`a[href="#${er.id}"]`).style.display = any ? "" : "none";
  }
  document.querySelectorAll("#chips input").forEach(cb=> cb.checked = active.has(cb.value));
  document.getElementById("count").textContent = `${shown} / ${EVENTS.length} 件を表示`;
  saveState();
}
const setCats = ids => { active = new Set(ids); apply(); };
document.getElementById("all").onclick     = ()=> setCats(CATS.map(c=>c.id));
document.getElementById("none").onclick    = ()=> setCats([]);
document.getElementById("nature").onclick  = ()=> setCats(CATS.filter(c=>c.group==="nature").map(c=>c.id));
document.getElementById("regions").onclick = ()=> setCats(CATS.filter(c=>c.group==="region").map(c=>c.id));
apply();
</script>
